[package]
name = "mender-bootc"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
description = "Mender Update Module for composefs bootc images."
repository = "https://github.com/yeetypete/mender-bootc"
license = "MIT"
keywords = ["bootc", "composefs", "mender", "ota", "update"]
categories = ["command-line-utilities"]
publish = false

[workspace]
[workspace.dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive"] }
serde_json = "1"

[workspace.lints.clippy]
dbg_macro = "warn"
exit = "warn"
pedantic = { level = "warn", priority = -1 }
print_stderr = "warn"
todo = "warn"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_code = "forbid"

[dependencies]
anyhow = { workspace = true }
camino = "1"
clap = { workspace = true }
oci-spec = { version = "0.10", default-features = false, features = ["distribution"] }
serde = { version = "1", features = ["derive"] }
serde_json = { workspace = true }
strum = { version = "0.27", features = ["derive"] }
tempfile = "3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[lints]
workspace = true

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
